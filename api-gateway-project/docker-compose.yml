version : '3.8' # defines the version of docker-compose

services: #containers that we want to run
  gateway: #name of the container
    build: ./gateway #path to the Dockerfile
    ports:
      - "3000:3000" #maps port 3000 of the container to port 3000 of the host machine
    depends_on:
      - user-service #gateway depends on user-service
      - item-service #gateway depends on ITEM-service
      - redis
    networks:
      - gateway_net
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      REDIS_ADDR: ${REDIS_ADDR:?set REDIS_ADDR in .env}
      USER_SERVICE_URL: ${USER_SERVICE_URL:?set USER_SERVICE_URL in .env}
      ITEM_SERVICE_URL: ${ITEM_SERVICE_URL:?set ITEM_SERVICE_URL in .env}

  user-service: #name of the container
    build: ./user-service #path to the Dockerfile
    ports:
      - "3002:3002" #maps port 3002 of the container to port 3002 of the host machine
    networks:
      - gateway_net

  item-service: #name of the container
    build: ./item-service #path to the Dockerfile
    ports:
      - "3001:3001" #maps port 3001 of the container to port 3001 of the host machine
    networks:
      - gateway_net
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" #maps port 6379 of the container to port 6379 of the host machine
    networks:
      - gateway_net
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432" #maps port 5432 of the container to port 5432 of the host machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gateway_net
  
volumes:
  postgres_data:
  
networks:
  gateway_net:            # Defines a custom network
    driver: bridge

